# Docker Compose - Distributed Automation Platform
# Provides: PostgreSQL, RabbitMQ (with management UI), Redis

services:
  # ============================================
  # PostgreSQL - Primary data store for job records
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: playx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automation_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # RabbitMQ - Async job queue with dead letter support
  # Management UI available at http://localhost:15672 (guest/guest)
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: playx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - Pub/Sub for real-time status updates + caching
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: playx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
